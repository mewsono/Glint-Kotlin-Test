name: lean-apk

# Builds the de-bloated `lean` tree on a machine that actually has the Android toolchain
# (this sandbox has neither a JDK nor an Android SDK, and Google Maven is firewalled).
#
# The sandbox cannot download raw run logs (results-receiver.actions.githubusercontent.com
# is firewalled), so every run publishes its diagnostics as a commit comment — that endpoint
# is on api.github.com and therefore readable.
on:
  push:
    branches:
      - 'arena/c7bd0426-glint-kotlin-test'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lean-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK diagnostics
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          which sdkmanager adb || true
          sdkmanager --list_installed 2>&1 | head -40 || true
          ls "$ANDROID_HOME/ndk" 2>/dev/null || true
          ls "$ANDROID_HOME/cmake" 2>/dev/null || true
          ls "$ANDROID_HOME/platforms" 2>/dev/null || true

      - name: Install SDK packages
        run: |
          SDKM=$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")
          echo "using $SDKM"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" --install "platforms;android-36" "build-tools;36.0.0" 2>&1 | tail -5

      - name: local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle', 'gradle/wrapper/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: gradle-

      # The whole point of the run: real compiler diagnostics. Output is tee'd so the
      # reporter step can publish the errors even when GitHub withholds the raw log.
      - name: assembleGithubDebug
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew :app:assembleGithubDebug --no-daemon --stacktrace 2>&1 | tee /tmp/build.log
          echo "gradle_exit=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: APK check
        if: steps.build.outcome == 'success'
        run: |
          Z=$(find app/build/outputs -name '*.apk' | head -1)
          ls -lh "$Z" | tee -a /tmp/report.txt
          echo "APK: $Z" >> /tmp/report.txt
          { unzip -l "$Z" | grep -E 'libonnxruntime|ncnn|assets/models' && echo "ML PAYLOAD STILL PRESENT"; } || echo "no ML payload" | tee -a /tmp/report.txt

      - name: Publish diagnostics as a commit comment
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "### \`assembleGithubDebug\` — exit ${{ steps.build.outputs.gradle_exit }}"
            echo
            echo '**Environment**'
            echo '```'
            java -version 2>&1 | head -2
            echo "ANDROID_HOME=$ANDROID_HOME"
            ls "$ANDROID_HOME/platforms" 2>/dev/null | tr '\n' ' '; echo
            ls "$ANDROID_HOME/build-tools" 2>/dev/null | tr '\n' ' '; echo
            echo '```'
            echo '**Errors**'
            echo '```'
            if [ -f /tmp/build.log ]; then
              # Only compiler diagnostics, and a high cap: one run should list every file
              # that still references deleted code, so fixes can be batched.
              grep -E "^e: " /tmp/build.log \
                | sed 's|file:///home/runner/work/[^/]*/[^/]*/||' | head -1500
              echo '---'
              grep -E "FAILURE:|What went wrong|Execution failed|Caused by:" /tmp/build.log | head -12
            fi
            echo '```'
            echo '**Tail**'
            echo '```'
            tail -40 /tmp/build.log 2>/dev/null
            echo '```'
          } > /tmp/report.md
          head -c 60000 /tmp/report.md > /tmp/report.trim.md
          gh api -X POST "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -f body="$(cat /tmp/report.trim.md)" > /dev/null && echo "diagnostics posted"

      - name: Upload APK
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: app-github-debug
          path: app/build/outputs/apk/github/debug/*.apk
          if-no-files-found: warn

      - name: Fail if the build failed
        if: steps.build.outcome != 'success'
        run: exit 1

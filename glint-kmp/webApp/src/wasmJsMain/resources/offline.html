<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Glint — offline</title>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #0b0a0e; color: #f3f0f5; font: 16px system-ui, sans-serif; text-align: center; }
    .card { padding: 32px; }
    h1 { font-size: 28px; margin: 0 0 8px; font-weight: 600; }
    p { color: #8e8895; margin: 0 0 18px; }
    button { background: #f3c25e; color: #2a1c00; border: 0; border-radius: 24px;
      padding: 10px 22px; font-size: 15px; font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>
  <div class="card">
    <h1>You're offline</h1>
    <p>Glint needs a connection to reach image sources.<br>Your bookmarks are safe on this device.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
